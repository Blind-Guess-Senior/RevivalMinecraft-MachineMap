machines:
  - name: 袭击塔
    category: 农场
    enabled: true
    products:
      - 绿宝石
      - 红石粉
      - 不死图腾
      - 鞍
      - 附魔书
    locations:
      - dimension: 主世界
        coords: [-1293, 124, 1355]
      - dimension: 地狱
        coords: [-159, 128, 163]
    usage: >
      发射器中拿等级为2的灾厄药水喝下。打开开关。使用横扫锋利经验修补的钻石剑（不可用击退和火焰附加）打假人。如果袭击源源不断则开机成功。
    notes: >
      进入末地前必须携带烟花鞘翅！
      武器要求：横扫 + 锋利 + 经验修补，禁止击退和火焰附加。
    travel_method: 地狱交通
    video_url: https://www.bilibili.com/video/BV1WSeEzhEVZ/
    contributors:

