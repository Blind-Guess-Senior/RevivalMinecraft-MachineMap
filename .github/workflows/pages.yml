name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 machines/files.json
        run: |
          cd machines
          find . -name '*.yaml' -o -name '*.yml' | sort | sed 's/^\.\///' | jq -R -s 'split("\n") | map(select(length > 0))' > files.json
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
